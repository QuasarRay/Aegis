# Preference fragment; apply through the host's supported configuration workflow.
# Preserve the user's model choice. No host settings are changed by the controller.
model_reasoning_effort = "max"

[agents]
max_concurrent_threads_per_session = 1
max_depth = 1
default_subagent_reasoning_effort = "max"

[features.multi_agent_v2]
# This host schema counts the parent. Do not automatically enable delegation.
max_concurrent_threads_per_session = 2
