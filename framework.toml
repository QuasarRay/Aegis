[framework]
name = "Aegis executable roadmaps"
version = "8.0.0-roadmaps.17"
project_independent = true

[roadmap]
registry = "Roadmaps/Shared/registry.json"
policy = "Roadmaps/Shared/policy.json"
compiler = "agentinfra.roadmap"
completion_claim = "roadmap package only; product completion requires current independent evidence"

[destiny]
status = "preserved specialization; historical policy lineage"
authority = "contracts/destiny.json"
profile = "modules/destiny/profile.toml"
workflow = "specify, reuse, implement, bind, verify, audit"
completion_claim = "declared scoped verifier observations only"

[cost]
reuse_first = true
reasoning_profile = "max"
automatic_agent_delegation = false
max_active_children = 1
mandatory_optional_quality_work = false
