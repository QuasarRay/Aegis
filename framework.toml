[framework]
name = "Aegis for Candle-rs"
version = "6.0.0-candle.1"
project_independent = false

[candle]
authority = "contracts/authority.json"
contract_language = "original HOL4 theories, unchanged"
target_language = "Rust"
model = "gpt-6-astra"
workflow = "bind, implement by reuse/generation, verify, checkpoint"
completion_claim = "scoped verifier observations"

[cost]
reuse_first = true
generation_second = true
handwritten_requires_reason = true
mandatory_optional_quality_work = false
automatic_agent_delegation = false
