name: Candle contract control plane
on:
  pull_request:
  push:
    branches: [candle-rs]
permissions:
  contents: read
  pull-requests: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate source and negative cases
        run: |
          python3 -m pip install -r database/requirements.txt
          python3 -B scripts/selftest.py
      - name: Qualify live PR checkpoint against the exact head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=infra python3 -B - <<'PY'
          import json,os,pathlib
          from agentinfra.checkpoints import attest
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr=event['pull_request']
          print(json.dumps(attest(pathlib.Path.cwd(), {
              'repository':event['repository']['full_name'], 'base':pr['base']['ref']
          }, pr['number']),sort_keys=True))
          PY
