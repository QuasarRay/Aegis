name: Candle contract control plane
on:
  pull_request:
  push:
    branches: [candle-rs]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate source and negative cases
        run: python3 -B scripts/selftest.py
