name: Aegis GitLab control-plane bridge

on:
  pull_request:
  push:
    branches:
      - main
      - candle-rs
      - 'metarocq/**'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AEGIS_GITLAB_URL: ${{ vars.AEGIS_GITLAB_URL }}
      AEGIS_GITLAB_PROJECT: ${{ vars.AEGIS_GITLAB_PROJECT }}
      AEGIS_GITLAB_API_TOKEN: ${{ secrets.AEGIS_GITLAB_API_TOKEN }}
      AEGIS_GITLAB_REF: ${{ github.head_ref || github.ref_name }}
      AEGIS_GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge structure locally
        run: |
          python3 -m unittest infra.tests.test_gitlab_runtime infra.tests.test_github_bridge_overlay -v
          python3 -m py_compile gitlab/assemble.py gitlab/materialize.py gitlab/github_actions_bridge.py dagger/supervision.py
      - name: Delegate exact mirrored commit to self-hosted GitLab when configured
        shell: bash
        run: |
          if [[ -n "$AEGIS_GITLAB_URL" && -n "$AEGIS_GITLAB_PROJECT" && -n "$AEGIS_GITLAB_API_TOKEN" ]]; then
            python3 gitlab/github_actions_bridge.py
          else
            echo "GitLab bridge credentials are not configured; local structural checks completed."
          fi
