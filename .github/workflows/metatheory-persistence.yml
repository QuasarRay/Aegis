name: Sequential metatheory persistence qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metatheory-persistence-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: aegis_test_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      AEGIS_TEST_ADMIN_DSN: postgresql://postgres:fixture-only@localhost:5432/aegis_test_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r database/requirements.txt
      - run: python3 -B scripts/selftest.py
